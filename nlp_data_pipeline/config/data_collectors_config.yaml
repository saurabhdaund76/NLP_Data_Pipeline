# Data Collectors Configuration

# Common settings for all collectors
common:
  retry_count: 3
  timeout: 30  # seconds
  batch_size: 100

# News API collector settings
news_api:
  base_url: "https://newsapi.org/v2"
  endpoints:
    everything: "/everything"
    top_headlines: "/top-headlines"
  rate_limit:
    requests_per_day: 1000
    requests_per_minute: 60
  categories:
    - technology
    - business
    - science
  languages:
    - en
  countries:
    - us
    - gb
    - in

# Web scraper settings
web_scraper:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  wait_time: 2  # seconds between requests
  timeout: 20
  selectors:
    title: "h1.article-title"
    content: "div.article-content"
    date: "span.article-date"
    author: "span.author-name"
  allowed_domains:
    - "example-news.com"
    - "tech-news.com"
  blocked_paths:
    - "/ads/"
    - "/sponsored/"
  pagination:
    enabled: true
    max_pages: 5

# PDF collector settings
pdf_collector:
  max_file_size: 10485760  # 10MB
  supported_versions: ["1.4", "1.5", "1.6", "1.7"]
  extract_metadata: true
  ocr_enabled: false
  password_protected: false
  timeout: 60

# Error handling
error_handling:
  max_retries: 3
  retry_delay: 5
  log_level: "INFO"
  error_types:
    network:
      retry: true
      max_attempts: 5
    parsing:
      retry: false
      log_level: "ERROR"
    rate_limit:
      retry: true
      delay: 60

# Monitoring
monitoring:
  enabled: true
  metrics:
    - collection_time
    - success_rate
    - error_count
  alerts:
    error_threshold: 10
    latency_threshold: 30

# Web Scraping Configuration
web_scraping:
  bbc_news:
    base_url: "https://www.bbc.com/news"
    selectors:
      title: "h1.story-body__h1"
      content: "div.story-body__inner p"
      date: "div.date"
      author: "span.byline__name"

  reuters:
    base_url: "https://www.reuters.com"
    selectors:
      title: "h1.article-headline"
      content: "div.article-body p"
      date: "time.article-date"
      author: "div.byline__author"

# News API Configuration
news_api:
  api_key: "your-newsapi-key"  # Replace with actual API key
  endpoints:
    top_headlines:
      endpoint: "top-headlines"
      params:
        country: "us"
        category: "technology"
        pageSize: 100

    everything:
      endpoint: "everything"
      params:
        q: "artificial intelligence"
        language: "en"
        sortBy: "publishedAt"
        pageSize: 100

# PDF Collection Configuration
pdf_collection:
  government_reports:
    url: "https://www.whitehouse.gov/wp-content/uploads/2023/03/National-Artificial-Intelligence-Research-and-Development-Strategic-Plan-2023.pdf"
    max_pages: 100

  research_papers:
    url: "https://arxiv.org/pdf/2303.12712.pdf"
    max_pages: 50

# Storage Configuration
storage:
  type: "gcs"  # or "local"
  gcs:
    bucket_name: "news-data-lake"
    project_id: "your-project-id"
    folders:
      web_scraping: "raw/web_scraping"
      news_api: "raw/news_api"
      pdfs: "raw/pdfs"
  local:
    base_path: "/data/news"
    folders:
      web_scraping: "web_scraping"
      news_api: "news_api"
      pdfs: "pdfs" 